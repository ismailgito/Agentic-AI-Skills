<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 60" width="100%" height="60">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00dfd8" stop-opacity="1">
        <animate attributeName="offset" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%" stop-color="#7928ca" stop-opacity="1">
        <animate attributeName="offset" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .matrix-char { font-family: 'Courier New', monospace; font-size: 11px; fill: #00dfd8; }
    .m-fade { animation: mFade 4s ease-in-out infinite; }
    @keyframes mFade { 0%,100% { opacity: 0.15; } 50% { opacity: 0.7; } }
  </style>
  <rect width="950" height="60" fill="#050810"/>
  <!-- Matrix rain characters -->
  <text x="15" y="18" class="matrix-char m-fade" style="animation-delay:0s">01001 SKILLS 11010 LOADED 00111 ACTIVE 10101 DEPLOY 01110 READY</text>
  <text x="30" y="35" class="matrix-char m-fade" style="animation-delay:1s;fill:#7928ca">クラウド ★ スキル ★ エコシステム ★ アクティブ ★ レディ ★ ゴー</text>
  <text x="10" y="52" class="matrix-char m-fade" style="animation-delay:2s;fill:#ff007f">▓▒░ SYSTEM.INIT ░▒▓ MODULE_COUNT=19+ ▓▒░ ZIP_SEALED=6 ░▒▓ STATUS=OPERATIONAL ▓▒░</text>
  <!-- Sweeping highlight -->
  <rect x="0" y="0" width="200" height="60" fill="url(#matrixGrad)" opacity="0.3">
    <animate attributeName="x" values="-200;950" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
