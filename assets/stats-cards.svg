<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 200" width="100%" height="200">
  <defs>
    <linearGradient id="sectionGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00dfd8;#ff007f" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#00dfd8;#ffbe0b;#ff007f;#00dfd8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .card-title { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 900; fill: url(#sectionGlow); letter-spacing: 2px; }
    .card-icon { animation: iconBounce 2s ease-in-out infinite; }
    .card-stat { font-family: 'Segoe UI', sans-serif; font-size: 22px; font-weight: 900; fill: #ffffff; }
    .card-label { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #8b949e; letter-spacing: 1px; }
    .spark { animation: sparkle 1.5s ease-in-out infinite; }
    @keyframes iconBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes sparkle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>

  <!-- Card 1: Skills -->
  <g transform="translate(10, 15)">
    <rect width="220" height="170" rx="16" class="card-bg"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#sectionGlow)"/>
    <text x="110" y="36" text-anchor="middle" class="card-title">⚡ SKILLS</text>
    <text x="110" y="95" text-anchor="middle" class="card-stat">19+</text>
    <text x="110" y="120" text-anchor="middle" class="card-label">ACTIVE MODULES</text>
    <!-- Pixel particle effects -->
    <rect x="30" y="140" width="4" height="4" fill="#ff007f" class="spark"/>
    <rect x="50" y="145" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:0.3s"/>
    <rect x="70" y="140" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:0.6s"/>
    <rect x="90" y="145" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:0.9s"/>
    <rect x="110" y="140" width="4" height="4" fill="#ff007f" class="spark" style="animation-delay:1.2s"/>
    <rect x="130" y="145" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:0.2s"/>
    <rect x="150" y="140" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:0.5s"/>
    <rect x="170" y="145" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:0.8s"/>
    <rect x="190" y="140" width="4" height="4" fill="#ff007f" class="spark" style="animation-delay:1.1s"/>
  </g>

  <!-- Card 2: ZIP Archives -->
  <g transform="translate(245, 15)">
    <rect width="220" height="170" rx="16" class="card-bg"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#00dfd8"/>
    <text x="110" y="36" text-anchor="middle" class="card-title">📦 ZIP FILES</text>
    <text x="110" y="95" text-anchor="middle" class="card-stat">6</text>
    <text x="110" y="120" text-anchor="middle" class="card-label">SEALED ARCHIVES</text>
    <rect x="30" y="140" width="4" height="4" fill="#00dfd8" class="spark"/>
    <rect x="50" y="145" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:0.2s"/>
    <rect x="70" y="140" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:0.4s"/>
    <rect x="90" y="145" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:0.6s"/>
    <rect x="110" y="140" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:0.8s"/>
    <rect x="130" y="145" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:1.0s"/>
    <rect x="150" y="140" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:1.2s"/>
    <rect x="170" y="145" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:1.4s"/>
    <rect x="190" y="140" width="4" height="4" fill="#00dfd8" class="spark" style="animation-delay:1.6s"/>
  </g>

  <!-- Card 3: Languages -->
  <g transform="translate(480, 15)">
    <rect width="220" height="170" rx="16" class="card-bg"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#7928ca"/>
    <text x="110" y="36" text-anchor="middle" class="card-title">🌐 LANGUAGES</text>
    <text x="110" y="95" text-anchor="middle" class="card-stat">8</text>
    <text x="110" y="120" text-anchor="middle" class="card-label">SDK RUNTIMES</text>
    <rect x="30" y="140" width="4" height="4" fill="#7928ca" class="spark"/>
    <rect x="50" y="145" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:0.2s"/>
    <rect x="70" y="140" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:0.4s"/>
    <rect x="90" y="145" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:0.6s"/>
    <rect x="110" y="140" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:0.8s"/>
    <rect x="130" y="145" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:1.0s"/>
    <rect x="150" y="140" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:1.2s"/>
    <rect x="170" y="145" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:1.4s"/>
    <rect x="190" y="140" width="4" height="4" fill="#7928ca" class="spark" style="animation-delay:1.6s"/>
  </g>

  <!-- Card 4: Domains -->
  <g transform="translate(715, 15)">
    <rect width="220" height="170" rx="16" class="card-bg"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#ffbe0b"/>
    <text x="110" y="36" text-anchor="middle" class="card-title">🎯 DOMAINS</text>
    <text x="110" y="95" text-anchor="middle" class="card-stat">7</text>
    <text x="110" y="120" text-anchor="middle" class="card-label">SKILL CATEGORIES</text>
    <rect x="30" y="140" width="4" height="4" fill="#ffbe0b" class="spark"/>
    <rect x="50" y="145" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:0.2s"/>
    <rect x="70" y="140" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:0.4s"/>
    <rect x="90" y="145" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:0.6s"/>
    <rect x="110" y="140" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:0.8s"/>
    <rect x="130" y="145" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:1.0s"/>
    <rect x="150" y="140" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:1.2s"/>
    <rect x="170" y="145" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:1.4s"/>
    <rect x="190" y="140" width="4" height="4" fill="#ffbe0b" class="spark" style="animation-delay:1.6s"/>
  </g>
</svg>
