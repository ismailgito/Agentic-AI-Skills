<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="140">
  <defs>
    <linearGradient id="zipGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00dfd8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>
    <filter id="zGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .zip-card { fill: #0d1117; stroke-width: 1.5; }
    .zip-name { font-family: 'Courier New', monospace; font-size: 9px; font-weight: 700; fill: #e6edf3; text-anchor: middle; }
    .zip-size { font-family: 'Segoe UI', sans-serif; font-size: 8px; fill: #8b949e; text-anchor: middle; }
    .zip-icon { font-size: 20px; text-anchor: middle; }
    .lock-pulse { animation: lockGlow 2s ease-in-out infinite alternate; }
    .orbit { animation: orbitSpin 8s linear infinite; transform-origin: center; }
    @keyframes lockGlow { 0% { filter: drop-shadow(0 0 2px #00dfd8); } 100% { filter: drop-shadow(0 0 8px #ff007f); } }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }
  </style>

  <rect width="950" height="140" rx="14" fill="#080b13" stroke="rgba(0,223,216,0.2)" stroke-width="1"/>

  <!-- Title -->
  <text x="475" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="900" fill="#00dfd8" letter-spacing="3">📦 SEALED ZIP ARCHIVES — DO NOT EXTRACT 📦</text>

  <!-- ZIP 1 -->
  <g transform="translate(90, 80)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" class="zip-card" stroke="#00dfd8"/>
    <text x="0" y="-10" class="zip-icon" class="lock-pulse">🔒</text>
    <text x="0" y="8" class="zip-name">claude counter.zip</text>
    <text x="0" y="20" class="zip-size">1.22 MB</text>
    <circle cx="60" cy="-25" r="3" fill="#00dfd8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ZIP 2 -->
  <g transform="translate(255, 80)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" class="zip-card" stroke="#7928ca"/>
    <text x="0" y="-10" class="zip-icon">🔒</text>
    <text x="0" y="8" class="zip-name">find-skills.zip</text>
    <text x="0" y="20" class="zip-size">2.73 KB</text>
    <circle cx="60" cy="-25" r="3" fill="#7928ca">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>

  <!-- ZIP 3 -->
  <g transform="translate(420, 80)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" class="zip-card" stroke="#ff007f"/>
    <text x="0" y="-10" class="zip-icon">🔒</text>
    <text x="0" y="8" class="zip-name">canvas-design.zip</text>
    <text x="0" y="20" class="zip-size">2.65 MB</text>
    <circle cx="60" cy="-25" r="3" fill="#ff007f">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>

  <!-- ZIP 4 -->
  <g transform="translate(585, 80)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" class="zip-card" stroke="#ffbe0b"/>
    <text x="0" y="-10" class="zip-icon">🔒</text>
    <text x="0" y="8" class="zip-name">docx-design-agent.zip</text>
    <text x="0" y="20" class="zip-size">51.3 KB</text>
    <circle cx="60" cy="-25" r="3" fill="#ffbe0b">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
  </g>

  <!-- ZIP 5 -->
  <g transform="translate(750, 80)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" class="zip-card" stroke="#00dfd8"/>
    <text x="0" y="-10" class="zip-icon">🔒</text>
    <text x="0" y="8" class="zip-name">theme-factory.zip</text>
    <text x="0" y="20" class="zip-size">124.7 KB</text>
    <circle cx="60" cy="-25" r="3" fill="#00dfd8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
  </g>

  <!-- Scanning beam across bottom -->
  <line x1="0" y1="130" x2="950" y2="130" stroke="url(#zipGlow)" stroke-width="1.5">
    <animate attributeName="stroke-dasharray" values="0,950;950,0;0,950" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
