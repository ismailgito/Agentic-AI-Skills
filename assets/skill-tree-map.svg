<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="320">
  <defs>
    <linearGradient id="treePulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00dfd8;#ff007f" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#00dfd8;#ffbe0b;#ff007f;#00dfd8" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00dfd8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .node-bg { fill: #0d1117; stroke-width: 1.8; }
    .node-label { font-family: 'Courier New', monospace; font-size: 10px; font-weight: 700; fill: #e6edf3; text-anchor: middle; }
    .node-icon { font-size: 18px; text-anchor: middle; }
    .data-pulse { animation: dataPulse 2s ease-in-out infinite; }
    .conn-line { stroke-dasharray: 5 3; animation: flowDash 2s linear infinite; }
    @keyframes dataPulse { 0%,100% { opacity: 0.5; r: 3; } 50% { opacity: 1; r: 5; } }
    @keyframes flowDash { to { stroke-dashoffset: -16; } }
  </style>

  <rect width="950" height="320" rx="16" fill="#080b13" stroke="rgba(121,40,202,0.3)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" font-weight="900" fill="url(#treePulse)" letter-spacing="3">⟐ SKILL CONSTELLATION MAP ⟐</text>

  <!-- CENTER NODE: Claude Skills -->
  <g transform="translate(475, 100)">
    <circle cx="0" cy="0" r="35" class="node-bg" stroke="url(#treePulse)" filter="url(#neonGlow)"/>
    <text x="0" y="-5" class="node-icon">🧠</text>
    <text x="0" y="12" class="node-label" font-size="8">CLAUDE</text>
    <text x="0" y="22" class="node-label" font-size="7" fill="#8b949e">SKILLS</text>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00dfd8" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CONNECTION LINES from center to nodes -->
  <!-- To Job Hunter -->
  <line x1="440" y1="100" x2="120" y2="80" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>
  <!-- To Fitness -->
  <line x1="440" y1="100" x2="120" y2="180" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>
  <!-- To Skills Main -->
  <line x1="510" y1="100" x2="830" y2="80" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>
  <!-- To Framework -->
  <line x1="510" y1="100" x2="830" y2="180" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>
  <!-- To Honest Advisor -->
  <line x1="475" y1="135" x2="300" y2="260" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>
  <!-- To Learning Curve -->
  <line x1="475" y1="135" x2="475" y2="250" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>
  <!-- To Caveman / Simple -->
  <line x1="475" y1="135" x2="650" y2="260" stroke="url(#connGrad)" stroke-width="1.2" class="conn-line"/>

  <!-- NODE: Job Hunter -->
  <g transform="translate(100, 70)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#ff007f"/>
    <text x="0" y="-5" class="node-icon" font-size="14">💼</text>
    <text x="0" y="12" class="node-label" font-size="8">JOB HUNTER</text>
    <circle cx="50" cy="-18" r="3" fill="#ff007f" class="data-pulse"/>
  </g>

  <!-- NODE: Fitness Coach -->
  <g transform="translate(100, 175)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#00ff88"/>
    <text x="0" y="-5" class="node-icon" font-size="14">💪</text>
    <text x="0" y="12" class="node-label" font-size="8">FITNESS</text>
    <circle cx="50" cy="-18" r="3" fill="#00ff88" class="data-pulse" style="animation-delay:0.5s"/>
  </g>

  <!-- NODE: Skills Main -->
  <g transform="translate(850, 70)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#7928ca"/>
    <text x="0" y="-5" class="node-icon" font-size="14">🔧</text>
    <text x="0" y="12" class="node-label" font-size="8">SKILLS-MAIN</text>
    <circle cx="50" cy="-18" r="3" fill="#7928ca" class="data-pulse" style="animation-delay:1s"/>
  </g>

  <!-- NODE: Framework -->
  <g transform="translate(850, 175)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#ffbe0b"/>
    <text x="0" y="-5" class="node-icon" font-size="14">📐</text>
    <text x="0" y="12" class="node-label" font-size="8">6-FIGURE FW</text>
    <circle cx="50" cy="-18" r="3" fill="#ffbe0b" class="data-pulse" style="animation-delay:1.5s"/>
  </g>

  <!-- NODE: Honest Advisor -->
  <g transform="translate(300, 265)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#ff007f"/>
    <text x="0" y="-5" class="node-icon" font-size="14">🗣️</text>
    <text x="0" y="12" class="node-label" font-size="8">HONEST ADVISOR</text>
    <circle cx="50" cy="-18" r="3" fill="#ff007f" class="data-pulse" style="animation-delay:0.3s"/>
  </g>

  <!-- NODE: Learning Curve -->
  <g transform="translate(475, 265)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#00dfd8"/>
    <text x="0" y="-5" class="node-icon" font-size="14">📈</text>
    <text x="0" y="12" class="node-label" font-size="8">LEARNING ARCH</text>
    <circle cx="50" cy="-18" r="3" fill="#00dfd8" class="data-pulse" style="animation-delay:0.7s"/>
  </g>

  <!-- NODE: Caveman + Simple -->
  <g transform="translate(650, 265)">
    <rect x="-55" y="-22" width="110" height="44" rx="12" class="node-bg" stroke="#ffbe0b"/>
    <text x="0" y="-5" class="node-icon" font-size="14">🪨</text>
    <text x="0" y="12" class="node-label" font-size="8">CAVEMAN+SIMPLE</text>
    <circle cx="50" cy="-18" r="3" fill="#ffbe0b" class="data-pulse" style="animation-delay:1.2s"/>
  </g>
</svg>
